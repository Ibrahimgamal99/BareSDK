name: Build mobile libraries

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # ── Android: 3 ABIs, symbol/alignment-verified, stripped jniLibs ────────
  # Ends by building the Flutter example APK. That is deliberate: this job is
  # the only place where freshly built jniLibs and the Dart/Kotlin plugin meet,
  # so it is the only place that can prove the FFI symbol names, the Kotlin
  # plugin class and the JNI bridge still line up after a native change.
  android:
    runs-on: ubuntu-22.04
    name: Android · arm64-v8a + armeabi-v7a + x86_64 + example APK
    steps:
      - uses: actions/checkout@v4

      # The runner exports ANDROID_NDK_LATEST_HOME; build-android.sh falls
      # back to it when ANDROID_NDK is unset.
      - name: Build all ABIs (fetches third_party, verifies, syncs jniLibs)
        run: bash scripts/build-android.sh
        env:
          ECHOSDK_BUILD_ROOT: ${{ runner.temp }}/echosdk-build

      - name: Upload jniLibs
        uses: actions/upload-artifact@v4
        with:
          name: android-jniLibs
          path: bindings/flutter/android/src/main/jniLibs/
          if-no-files-found: error

      - name: Upload dist (unstripped, with static archives)
        uses: actions/upload-artifact@v4
        with:
          name: android-dist
          path: dist/android/
          if-no-files-found: error

      # AGP 9 / Gradle 9 (see example/android/settings.gradle.kts) need JDK 17,
      # which is also what the plugin compiles against (jvmTarget = '17').
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # build-android.sh has just refreshed src/main/jniLibs/<abi>/libechosdk.so,
      # so this APK links the ABIs built above, not the committed blobs.
      - name: Build example APK
        working-directory: bindings/flutter/example
        run: |
          flutter pub get
          flutter build apk --debug

      - name: Upload example APK
        uses: actions/upload-artifact@v4
        with:
          name: android-example-apk
          path: bindings/flutter/example/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

  # ── iOS: dynamic xcframework (device arm64 + simulator arm64/x86_64) ────
  # The example app is built in this same job on purpose. Round-tripping the
  # xcframework through upload/download-artifact would flatten the framework's
  # symlinks and drop the exec bit on its Mach-O binary, so the pod would
  # vendor something that cannot link.
  ios:
    runs-on: macos-14
    name: iOS · EchoSDK.xcframework + example app
    steps:
      - uses: actions/checkout@v4

      - name: Build xcframework (fetches third_party, verifies, syncs plugin)
        run: bash scripts/build-ios.sh

      - name: Upload xcframework
        uses: actions/upload-artifact@v4
        with:
          name: ios-xcframework
          path: dist/ios/EchoSDK.xcframework/
          if-no-files-found: error

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # build-ios.sh stages the xcframework into bindings/flutter/ios/Frameworks,
      # which is what echo_sdk.podspec vendors — so `pod install` resolves here
      # and its prepare_command guard passes. No signing identity on CI.
      - name: Build example app (no codesign)
        working-directory: bindings/flutter/example
        run: |
          flutter pub get
          flutter build ios --debug --no-codesign

  # ── Dart binding: analyzer + tests against a real native build ───────────
  # The native library is built first so test/echo_sdk_smoke_test.dart actually
  # runs. It self-skips when dist/linux/x86_64/echosdk.so is missing, so
  # without this the job passed while executing nothing.
  dart:
    runs-on: ubuntu-22.04
    name: Dart · analyze + tests
    steps:
      - uses: actions/checkout@v4

      - name: Install native build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build gcc g++ pkg-config libssl-dev libpulse-dev

      # AEC off: the webrtc_aec module needs libwebrtc-audio-processing-1, which
      # has no ubuntu-22.04 package and would mean building it from source here.
      # Nothing under test/ exercises AEC.
      - name: Build native library
        run: bash scripts/build-linux.sh
        env:
          ECHOSDK_WITH_WEBRTC_AEC: 'OFF'

      # Guards against silently going back to a vacuous test run. The smoke
      # test resolves this same path relative to bindings/flutter.
      - name: Assert the tests have a library to load
        run: test -f dist/linux/x86_64/echosdk.so

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Analyze
        working-directory: bindings/flutter
        run: |
          flutter pub get
          dart analyze lib

      - name: Tests (e2e_asterisk_test self-skips without a SIP server)
        working-directory: bindings/flutter
        run: flutter test
