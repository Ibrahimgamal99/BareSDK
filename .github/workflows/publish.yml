name: Build & Publish wheels

on:
  push:
    tags: ["v*"]          # trigger on version tags: v1.0.0, v1.2.3, …
  workflow_dispatch:       # allow manual runs from the Actions tab

jobs:
  # ── Build Linux wheel ────────────────────────────────────────────────
  build-linux:
    runs-on: ubuntu-22.04
    container: quay.io/pypa/manylinux_2_28_x86_64
    name: Wheel · linux_x86_64

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build deps
        run: |
          yum install -y cmake ninja gcc gcc-c++ pkg-config \
            openssl-devel zlib-devel pulseaudio-libs-devel
          # Build webrtc-audio-processing from source
          cd /tmp
          curl -L -o webrtc.tar.gz https://gitlab.freedesktop.org/pulseaudio/webrtc-audio-processing/-/archive/v1.3/webrtc-audio-processing-1.3.tar.gz
          tar xzf webrtc.tar.gz
          cd webrtc-audio-processing-1.3
          mkdir build && cd build
          cmake .. -DCMAKE_INSTALL_PREFIX=/usr -GNinja
          ninja install

      - name: Build SDK
        run: bash scripts/build-linux.sh

      - name: Generate CFFI header
        # Shared with bindings/python/build.sh so the wheels users install
        # cannot drift from locally built ones.  This step used to be a
        # near-copy of that pipeline missing -DBARESDK_NO_PACKED_ENUM, which
        # widened baresdk_aec_mode_t from 1 to 4 bytes in the cffi view and
        # mis-offset every baresdk_config_t field after cfg.aec_mode.
        run: |
          bash bindings/python/gen_header.sh
          cp dist/linux/x86_64/baresdk.so bindings/python/baresdk/baresdk.so

      - name: Build wheel
        run: |
          /opt/python/cp311-cp311/bin/pip install cffi setuptools wheel build auditwheel
          cd bindings/python
          /opt/python/cp311-cp311/bin/python -m build --wheel --outdir /tmp/wheel
          /opt/python/cp311-cp311/bin/auditwheel repair /tmp/wheel/*.whl -w dist/wheels/

      - name: Show wheel
        run: ls -lh bindings/python/dist/wheels/

      - uses: actions/upload-artifact@v4
        with:
          name: wheel-linux_x86_64
          path: bindings/python/dist/wheels/*.whl

  # ── Build Windows wheel ───────────────────────────────────────────────
  build-windows:
    runs-on: windows-2022
    name: Wheel · win_amd64

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up vcpkg
        uses: johnwason/vcpkg-action@v6
        with:
          pkgs: openssl zlib abseil
          triplet: x64-windows-static-md
          token: ${{ secrets.GITHUB_TOKEN }}
          github-binarycache: true

      - name: Build SDK (Windows)
        shell: pwsh
        run: .\scripts\build-windows.ps1 -VcpkgRoot $env:VCPKG_ROOT

      - name: Copy .dll into package
        shell: pwsh
        run: Copy-Item dist\windows\x64\baresdk.dll bindings\python\baresdk\baresdk.dll -Force

      - name: Build wheel
        run: |
          pip install build
          python -m build --wheel bindings/python --outdir dist/wheels/

      - name: Show wheel
        run: ls dist/wheels/

      - uses: actions/upload-artifact@v4
        with:
          name: wheel-win_amd64
          path: dist/wheels/*.whl

  # ── Publish all wheels to PyPI ──────────────────────────────────────────────
  publish:
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    name: Publish to PyPI
    environment: pypi
    permissions:
      id-token: write   # required for trusted publishing (no API token needed)

    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          merge-multiple: true
          path: dist/wheels/

      - name: Show wheels to upload
        run: ls -lh dist/wheels/

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/wheels/
