[package]
name    = "baresdk-sys"
version = "1.0.0"
edition = "2021"
description = "Raw FFI bindings for baresdk (auto-generated via bindgen)"
links   = "baresdk"

[build-dependencies]
bindgen = "0.69"

[dependencies]

# Path to the pre-built baresdk.a is resolved in build.rs via:
#   BARESDK_LIB_DIR  — directory containing baresdk.a
#   BARESDK_INCLUDE  — directory containing baresdk.h (default: ../../include)
