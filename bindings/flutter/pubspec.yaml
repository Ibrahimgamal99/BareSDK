name: baresdk
description: >-
  Flutter/Dart SIP softphone SDK (baresip-based): UDP/TCP/TLS/WS/WSS
  registration, calls, codec control, reconnection & network handover,
  media statistics and quality alerts.
version: 1.0.0
homepage: https://github.com/Ibrahimgamal99/BareSDK
repository: https://github.com/Ibrahimgamal99/BareSDK
issue_tracker: https://github.com/Ibrahimgamal99/BareSDK/issues
documentation: https://github.com/Ibrahimgamal99/BareSDK/blob/main/docs/quickstart/flutter.md
topics:
  - sip
  - voip
  - softphone
  - webrtc
  - ffi

environment:
  sdk: ">=3.1.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  ffi: ^2.1.0

dev_dependencies:
  ffigen: ^12.0.0
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      # Android is a hybrid plugin:
      #  - ffiPlugin ships the prebuilt libbaresdk.so from src/main/jniLibs
      #  - BaresdkPlugin (Kotlin) provides cache dir, audio focus, speaker
      #    routing and ConnectivityManager callbacks over MethodChannel.
      android:
        package: dev.baresdk.flutter
        pluginClass: BaresdkPlugin
        ffiPlugin: true
      # iOS vendors the prebuilt dynamic baresdk.xcframework via the podspec
      # (built by scripts/build-ios.sh on macOS/CI) plus a Swift shim for
      # audio session / speaker routing / NWPathMonitor callbacks.
      ios:
        pluginClass: BaresdkPlugin
      # Desktop: the app bundles the native library itself (or passes
      # BareSDK(libPath: ...)); see lib/src/sdk.dart loadLib().
