name: baresdk
description: Flutter/Dart binding for baresdk — SIP, WebRTC, NAT, media SDK.
version: 1.0.0

environment:
  sdk: ">=3.1.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  ffi: ^2.1.0

dev_dependencies:
  ffigen: ^12.0.0
  flutter_test:
    sdk: flutter

# Not a Flutter plugin: this package ships no platform scaffolding and builds
# no native code. It is a pure-Dart FFI wrapper that opens a prebuilt baresdk
# library at runtime (see loadLib() in lib/src/sdk.dart).
#
# The host app is responsible for shipping the native library:
#   Android — put dist/android/<abi>/baresdk.so in src/main/jniLibs/<abi>/
#   iOS     — link dist/ios/baresdk.xcframework (symbols resolve via
#             DynamicLibrary.process())
#   Linux   — bundle baresdk.so next to the executable, or pass
#             BareSDK(libPath: '/abs/path/baresdk.so')
#   macOS   — bundle baresdk.dylib in Frameworks/
#   Windows — place baresdk.dll beside the .exe
