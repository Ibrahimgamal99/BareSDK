name: baresdk
description: Flutter/Dart binding for baresdk — SIP, WebRTC, NAT, media SDK.
version: 1.0.0

environment:
  sdk: ">=3.1.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  ffi: ^2.1.0

dev_dependencies:
  ffigen: ^12.0.0
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        ffiPlugin: true
      ios:
        ffiPlugin: false
      linux:
        ffiPlugin: true
      macos:
        ffiPlugin: false
      windows:
        ffiPlugin: true
