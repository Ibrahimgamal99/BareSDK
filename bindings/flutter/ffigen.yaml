# ffigen configuration for baresdk
# Run: dart run ffigen --config ffigen.yaml
# Output: lib/src/ffi_bindings.dart

name: BareSDKBindings
description: 'Auto-generated Dart FFI bindings for baresdk.'
output: 'lib/src/ffi_bindings.dart'

headers:
  entry-points:
    - '../../include/baresdk.h'

compiler-opts:
  - '-I../../include'
  - '-isystem/usr/lib/clang/21/include'

# Symbol filtering
functions:
  include:
    - 'baresdk_.*'

globals:
  include:
    - 'BARESDK_.*'

macros:
  include:
    - 'BARESDK_.*'

enums:
  include:
    - 'baresdk_.*'

structs:
  include:
    - 'baresdk_.*'

typedefs:
  include:
    - 'baresdk_.*'

comments:
  style: any
  length: full
