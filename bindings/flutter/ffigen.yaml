# ffigen configuration for VoxSDK
# Run: dart run ffigen --config ffigen.yaml
# Output: lib/src/ffi_bindings.dart

name: VoxSDKBindings
description: 'Auto-generated Dart FFI bindings for VoxSDK.'
output: 'lib/src/ffi_bindings.dart'

headers:
  entry-points:
    - '../../include/voxsdk.h'

compiler-opts:
  - '-I../../include'
  # ffigen ignores __attribute__((packed)) on enums and would widen
  # voxsdk_aec_mode_t to 4 bytes, shifting every later config field.
  - '-DVOXSDK_NO_PACKED_ENUM=1'
  # Adjust to the local clang resource dir (ls /usr/lib/clang/).
  - '-isystem/usr/lib/clang/21/include'

# Symbol filtering
functions:
  include:
    - 'voxsdk_.*'

globals:
  include:
    - 'VOXSDK_.*'

macros:
  include:
    - 'VOXSDK_.*'

enums:
  include:
    - 'voxsdk_.*'

structs:
  include:
    - 'voxsdk_.*'

typedefs:
  include:
    - 'voxsdk_.*'

comments:
  style: any
  length: full
