# ffigen configuration for baresdk
# Run: dart run ffigen --config ffigen.yaml
# Output: lib/src/ffi_bindings.dart

name: BareSDKBindings
description: 'Auto-generated Dart FFI bindings for baresdk.'
output: 'lib/src/ffi_bindings.dart'

headers:
  entry-points:
    - '../../include/baresdk.h'

compiler-opts:
  - '-I../../include'
  # ffigen ignores __attribute__((packed)) on enums and would widen
  # baresdk_aec_mode_t to 4 bytes, shifting every later config field.
  - '-DBARESDK_NO_PACKED_ENUM=1'
  # Adjust to the local clang resource dir (ls /usr/lib/clang/).
  - '-isystem/usr/lib/clang/21/include'

# Symbol filtering
functions:
  include:
    - 'baresdk_.*'

globals:
  include:
    - 'BARESDK_.*'

macros:
  include:
    - 'BARESDK_.*'

enums:
  include:
    - 'baresdk_.*'

structs:
  include:
    - 'baresdk_.*'

typedefs:
  include:
    - 'baresdk_.*'

comments:
  style: any
  length: full
