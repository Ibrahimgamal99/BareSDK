# ffigen configuration for EchoSDK
# Run: dart run ffigen --config ffigen.yaml
# Output: lib/src/ffi_bindings.dart

name: EchoSDKBindings
description: 'Auto-generated Dart FFI bindings for EchoSDK.'
output: 'lib/src/ffi_bindings.dart'

headers:
  entry-points:
    - '../../include/echosdk.h'

compiler-opts:
  - '-I../../include'
  # ffigen ignores __attribute__((packed)) on enums and would widen
  # echosdk_aec_mode_t to 4 bytes, shifting every later config field.
  - '-DECHOSDK_NO_PACKED_ENUM=1'
  # Adjust to the local clang resource dir (ls /usr/lib/clang/).
  - '-isystem/usr/lib/clang/21/include'

# Symbol filtering
functions:
  include:
    - 'echosdk_.*'

globals:
  include:
    - 'ECHOSDK_.*'

macros:
  include:
    - 'ECHOSDK_.*'

enums:
  include:
    - 'echosdk_.*'

structs:
  include:
    - 'echosdk_.*'

typedefs:
  include:
    - 'echosdk_.*'

comments:
  style: any
  length: full
